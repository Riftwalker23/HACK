<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roshan Rozgar — Figma export</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Roshan Rozgar — shared token + component layer (light/dark, worker/customer skins). Logical properties only (RTL-safe). */
.app{--ink:#0B1020;--paper:#F8F6F1;--slate:#F3F5F8;--roshan:#FF9F1C;--roshan-deep:#D97E06;--roshan-text:#8A4A00;--teal:#0E6E6B;--teal-deep:#0A5250;--on-teal:#fff;--accept:#0B6B3D;--decline:#B3162B;--free:#1D9A5F;--busy:#C2410C;--off:#6B7280;--star:#F2B01E;--rose:#E8336D;--cobalt:#2A4BD7;--leaf:#3FA34D;--text:#0B1020;--soft:#3A4256;--bg:var(--paper);--surface:#fff;--line:#DDD5C3;--tint:#FFF0D6;--ttint:#DDF0EE;--mapbg:#E6ECE4;--road:#fff;--add:0px;--fb:20px;--ft:30px;--fd:40px;--fl:18px;--r-sm:10px;--r-md:16px;--r-lg:24px;--sh1:0 1px 2px rgba(11,16,32,.06);--sh2:0 12px 32px -8px rgba(11,16,32,.18)}
.app.cust{--bg:var(--slate);--line:#D5DBE5;--fb:16px;--ft:22px;--fd:30px;--fl:14px}
.app[data-theme=dark]{--text:#F6F2E9;--soft:#C3CAD9;--paper:#141A28;--slate:#0F1522;--surface:#1D2538;--line:#33405C;--roshan:#FFB347;--roshan-text:#FFC46B;--teal:#4FC3BD;--on-teal:#06201F;--cobalt:#8EA2FF;--tint:#2B2416;--ttint:#12302F;--free:#3DD68C;--busy:#FF8A4C;--off:#9AA3B2;--mapbg:#18202F;--road:#2A344A;--sh1:0 1px 2px rgba(0,0,0,.4)}

.app,.app *{box-sizing:border-box}
.app{width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:calc(var(--fb) + var(--add));line-height:1.5;-webkit-font-smoothing:antialiased}
.app.ur{--add:2px;font-family:"Noto Naskh Arabic","Plus Jakarta Sans",serif;line-height:1.75}
.app.ur .nq{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;line-height:2}
.app h1,.app h2,.app h3,.app p,.app ul{margin:0;padding:0}
.app ul{list-style:none}
.app button{font:inherit;color:inherit;cursor:pointer}
.app a{color:inherit}
.app :focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.app svg.ic{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.app svg.ic.s20{width:20px;height:20px}.app svg.ic.s24{width:24px;height:24px}.app svg.ic.lg{width:40px;height:40px}.app svg.ic.xl{width:56px;height:56px}.app svg.ic.xxl{width:72px;height:72px}
.app svg.gly{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.app[dir=rtl] .flip{transform:scaleX(-1)}
.app .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* type */
.d{font-size:calc(var(--fd) + var(--add));line-height:1.15;font-weight:800}
.t{font-size:calc(var(--ft) + var(--add));line-height:1.25;font-weight:800}
.b{font-size:calc(var(--fb) + var(--add));line-height:1.5}
.l{font-size:calc(var(--fl) + var(--add));line-height:1.4;font-weight:600}
.xs{font-size:12px;line-height:1.3;font-weight:700}
.soft{color:var(--soft)}.rt{color:var(--roshan-text)}.bold{font-weight:800}.num{font-variant-numeric:tabular-nums}
.cust .tl{color:var(--teal-deep)}.app[data-theme=dark].cust .tl{color:var(--teal)}

/* utilities */
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}.fx{flex:1;min-width:0}.wrap{flex-wrap:wrap}.ctr{justify-content:center;text-align:center;align-items:center}.sb{justify-content:space-between}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}
.px{padding-inline:16px}.pad{padding:16px}
.dock{margin-block-start:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px;flex:none}

/* top bar + language toggle (present on every screen) */
.top{display:flex;align-items:center;gap:8px;padding:12px 16px;flex:none}
.iconbtn{width:56px;height:56px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;flex:none;padding:0}
.cust .iconbtn{width:44px;height:44px;border-radius:14px}
.seg3{display:flex;flex:1;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:4px;gap:4px}
.cust .seg3{border-radius:14px}
.seg3 button{flex:1;height:48px;border:0;border-radius:14px;background:transparent;font-weight:700;font-size:16px;min-width:0;padding:0 4px;font-family:"Plus Jakarta Sans","Noto Naskh Arabic",sans-serif}
.cust .seg3 button{height:44px;border-radius:11px}
.seg3 button.on{background:var(--text);color:var(--bg)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:64px;padding:0 24px;border-radius:24px;border:0;font-weight:800;font-size:calc(var(--fb) + var(--add));text-decoration:none;color:inherit;line-height:1.3}
.cust .btn{min-height:48px;border-radius:16px;padding:0 16px}
.btn-p{background:var(--roshan);color:#0B1020}
.btn-t{background:var(--teal);color:var(--on-teal)}
.btn-ok{background:var(--accept);color:#fff}
.btn-no{background:var(--decline);color:#fff}
.btn-o{background:var(--surface);border:2px solid var(--line);color:var(--text)}
.btn.big{min-height:88px;font-size:calc(24px + var(--add));border-radius:28px}
.btn:active{filter:brightness(.92);transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* surfaces */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh1)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:calc(var(--fl) + var(--add));white-space:nowrap;color:var(--text)}
.chip.sel{border-color:var(--text);background:color-mix(in srgb,var(--text) 8%,var(--surface))}
.chip.sm{min-height:32px;padding:0 10px;font-size:13px;gap:6px}
.ai{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:1px solid var(--cobalt);color:var(--cobalt);border-radius:999px;font:700 12px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:.02em;white-space:nowrap;background:transparent}
.ph{border-radius:16px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--text) 9%,var(--surface)) 0 12px,var(--surface) 12px 24px);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--soft);text-align:center;font-size:12px;font-weight:700}

/* availability pill — shape + word + motion */
.pill{--pc:var(--free);display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border-radius:999px;font-weight:700;font-size:calc(var(--fl) + var(--add));background:color-mix(in srgb,var(--pc) 14%,var(--surface));border:2px solid var(--pc);color:var(--text);white-space:nowrap}
.pill.busy{--pc:var(--busy)}.pill.off{--pc:var(--off)}
.dot{position:relative;width:16px;height:16px;flex:none;color:var(--pc)}
.dot svg{position:relative;z-index:1;width:16px;height:16px;display:block}
.pill:not(.busy):not(.off) .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--pc);animation:ripple 3s ease-out infinite}

/* progress rail */
.rail{display:flex;align-items:center}
.rail .n{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;background:var(--surface);flex:none;color:var(--soft)}
.rail .n.done{background:var(--accept);border-color:var(--accept);color:#fff}
.rail .n.cur{border-color:var(--roshan-deep);background:var(--roshan);color:#0B1020}
.rail .ln{flex:1;height:4px;background:var(--line);min-width:8px}
.rail .ln.done{background:var(--accept)}
.rail.sm .n{width:36px;height:36px;border-width:2px}

/* trade quadruple: colour + glyph + Urdu word + audio */
.gl{display:grid;place-items:center;border-radius:50%;background:var(--c);color:var(--g);flex:none}
.gl svg{width:64%;height:64%}
.gl.s32{width:32px;height:32px}.gl.s40{width:40px;height:40px}.gl.s56{width:56px;height:56px}.gl.s72{width:72px;height:72px}.gl.s88{width:88px;height:88px}
.tr-elec{--c:#F2B01E;--g:#0B1020}.tr-plum{--c:#2A6FD7;--g:#fff}.tr-ac{--c:#2BB3C0;--g:#0B1020}.tr-carp{--c:#A4622D;--g:#fff}.tr-mech{--c:#55606E;--g:#fff}.tr-paint{--c:#7A4FD1;--g:#fff}.tr-mason{--c:#8A8178;--g:#0B1020}
.tile{position:relative;display:flex}
.tile .tm{flex:1;border-radius:var(--r-lg);border:3px solid transparent;background:color-mix(in srgb,var(--c) 16%,var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;font-weight:800;text-align:center;color:var(--text)}
.tile.sel .tm{border-color:var(--text);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c)}
.tile .tick{position:absolute;inset-block-start:8px;inset-inline-start:8px;width:30px;height:30px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
.tile .spk{position:absolute;inset-block-start:6px;inset-inline-end:6px;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;padding:0;color:var(--text)}

/* ornament: truck-art strip, used only on wordmark, worker card header, receipt */
.truck{height:5px;flex:none;background:repeating-linear-gradient(90deg,var(--rose) 0 14px,transparent 14px 19px,var(--cobalt) 19px 33px,transparent 33px 38px,var(--leaf) 38px 52px,transparent 52px 57px)}
.lockup{background:var(--surface);border-radius:18px;overflow:hidden;border:2px solid var(--line)}

/* voice orb + waveform */
.orb{position:relative;width:96px;height:96px;flex:none}
.orb .mic{position:relative;z-index:2;width:96px;height:96px;border-radius:50%;border:0;background:var(--roshan);color:#0B1020;display:grid;place-items:center;box-shadow:var(--sh2);animation:breathe 2.4s ease-in-out infinite;padding:0}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--roshan);animation:ring 2.4s ease-out infinite}
.orb::after{animation-delay:1.2s}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:48px}
.wave i{width:5px;height:100%;border-radius:3px;background:var(--roshan);transform-origin:center;animation:bar 1.1s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}.wave i:nth-child(5n){animation-delay:.45s}.wave i:nth-child(7n){animation-delay:.6s}
.wv{display:flex;align-items:center;gap:3px;flex:1;height:32px}
.wv i{width:4px;border-radius:2px;background:var(--soft);opacity:.75}
.wv i:nth-child(4n+1){height:35%}.wv i:nth-child(4n+2){height:75%}.wv i:nth-child(4n+3){height:50%}.wv i:nth-child(4n){height:95%}
.vn{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--surface);border:2px solid var(--line)}
.vn .play{width:48px;height:48px;border-radius:50%;border:0;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;flex:none;padding:0}
.work .vn .play{background:var(--roshan);color:#0B1020}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(11,16,32,.4)}
.sheet{position:absolute;inset-inline:0;inset-block-end:0;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--sh2);padding:12px 16px 20px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}

/* map */
.map{position:relative;background:var(--mapbg);overflow:hidden}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.me{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--teal);border:3px solid #fff;transform:translate(-50%,-50%)}
.me::before,.me::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--teal);animation:ring 2.4s ease-out infinite}
.me::after{animation-delay:1.2s}
.pin{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(11,16,32,.35)}
.pin svg{width:60%;height:60%}

/* trust ribbon */
.ribbon{height:20px;border-radius:999px;background:var(--line);overflow:hidden}
.ribbon i{display:block;height:100%;border-radius:999px;background:var(--roshan);width:74%;animation:fill 1.6s cubic-bezier(.2,.8,.2,1) 1 both}
.stars{display:inline-flex;gap:2px;color:var(--star)}
.stars svg{fill:currentColor;stroke:#8A6200;stroke-width:1}

@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes ripple{0%{transform:scale(.7);opacity:.6}100%{transform:scale(2.3);opacity:0}}
@keyframes bar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes fill{from{width:62%}to{width:74%}}
/* maps: SVG attributes can't read CSS variables, so roads are coloured here; plus a street-grid texture */
.map{background-image:repeating-linear-gradient(0deg,transparent 0 30px,color-mix(in srgb,var(--road) 70%,transparent) 30px 33px),repeating-linear-gradient(90deg,transparent 0 30px,color-mix(in srgb,var(--road) 70%,transparent) 30px 33px)}
.map svg.bg [stroke="var(--road)"]{stroke:var(--road)}
.me.amber{background:var(--roshan)}
.me.amber::before,.me.amber::after{border-color:var(--roshan)}

/* ===== Local vibe layer: truck-art stripe, jaali lattice, jhalar fringe, chunky pressable buttons ===== */
.app.work{background-image:radial-gradient(circle,color-mix(in srgb,var(--roshan) 22%,transparent) 0 2px,transparent 2.5px),linear-gradient(45deg,transparent 47%,color-mix(in srgb,var(--roshan) 9%,transparent) 48% 52%,transparent 53%),linear-gradient(-45deg,transparent 47%,color-mix(in srgb,var(--roshan) 9%,transparent) 48% 52%,transparent 53%);background-size:32px 32px}
.app.cust{background-image:linear-gradient(45deg,transparent 48%,color-mix(in srgb,var(--teal) 5%,transparent) 49% 51%,transparent 52%),linear-gradient(-45deg,transparent 48%,color-mix(in srgb,var(--teal) 5%,transparent) 49% 51%,transparent 52%);background-size:36px 36px}
.jhalar{height:13px;flex:none;background:radial-gradient(circle at 7px 0,var(--rose) 6px,transparent 6.5px) 0 0/42px 13px repeat-x,radial-gradient(circle at 7px 0,var(--roshan) 6px,transparent 6.5px) 14px 0/42px 13px repeat-x,radial-gradient(circle at 7px 0,var(--leaf) 6px,transparent 6.5px) 28px 0/42px 13px repeat-x}
.btn-p{box-shadow:0 5px 0 var(--roshan-deep)}
.btn-ok{box-shadow:0 5px 0 #06452A}
.btn-no{box-shadow:0 5px 0 #7A0E1C}
.btn-t{box-shadow:0 4px 0 var(--teal-deep)}
.btn-o{box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(4px);box-shadow:none;filter:none}
.work .card,.work .iconbtn,.work .seg3{border-width:3px}
.work .iconbtn{box-shadow:0 3px 0 var(--line)}
.orb .mic{box-shadow:0 6px 0 var(--roshan-deep),0 0 0 8px color-mix(in srgb,var(--roshan) 25%,transparent)}

/* ===== Urdu & Roman Urdu mirror the English design: same sizes, spacing, colours and layout.
   Only the script, the font (Naskh for Urdu) and the reading direction (RTL for Urdu) change. ===== */
.app.ur{--add:1px;line-height:1.6}
.app.ur .nq,.app.ur h1,.app.ur h2,.app.ur .t,.app.ur .d{font-family:"Noto Naskh Arabic","Plus Jakarta Sans",serif;line-height:1.45}
.app.ur .num,.app.ur [dir=ltr]{font-family:"Plus Jakarta Sans",sans-serif}
.app.ur .ai{font-family:"Noto Naskh Arabic","Plus Jakarta Sans",sans-serif}
/* Team decision: Urdu keeps the exact English layout (no mirroring). Each Urdu line still reads right-to-left
   internally (unicode-bidi: plaintext), but positions, alignment and icons match the English screens. */
.app[dir=rtl]{direction:ltr}
.app[dir=rtl] .flip{transform:none}
.app.ur h1,.app.ur h2,.app.ur p,.app.ur span,.app.ur a,.app.ur button,.app.ur td,.app.ur li{unicode-bidi:plaintext}
.app.ur h1,.app.ur h2,.app.ur p,.app.ur td{text-align:left}
.app.ur td[style*="text-align: end"]{text-align:right!important}

/* ===== Final polish: calmer, cleaner, same layout ===== */
/* calmer backgrounds: worker jaali whispered, customer plain */
.app.work{background-image:radial-gradient(circle,color-mix(in srgb,var(--roshan) 14%,transparent) 0 1.5px,transparent 2px);background-size:28px 28px}
.app.cust{background-image:none}
/* softer surfaces: thinner borders, one gentle shadow */
.app{--line:#E6E0D3;--sh1:0 1px 2px rgba(11,16,32,.05),0 4px 12px -6px rgba(11,16,32,.10)}
.app.cust{--line:#E1E6EE}
.app[data-theme=dark]{--line:#2E3850;--sh1:0 1px 2px rgba(0,0,0,.4)}
.card,.vn,.chip,.wc,.job,.sk,.es,.th,.ph,.lockup{border-width:1.5px!important}
.work .card,.work .iconbtn,.work .seg3{border-width:2px}
.card,.wc,.job,.sk,.es,.vn{box-shadow:var(--sh1)}
.iconbtn{box-shadow:none!important;border-width:1.5px}
/* language switch: brand colour for the active language */
.seg3{border-width:1.5px;box-shadow:var(--sh1)}
.work .seg3 button.on{background:var(--roshan);color:#0B1020}
.cust .seg3 button.on{background:var(--teal);color:var(--on-teal)}
/* buttons: lighter press-edge, same tap feel */
.btn-p{box-shadow:0 3px 0 var(--roshan-deep)}
.btn-ok{box-shadow:0 3px 0 #06452A}
.btn-no{box-shadow:0 3px 0 #7A0E1C}
.btn-t{box-shadow:0 3px 0 var(--teal-deep)}
.btn-o{box-shadow:0 2px 0 var(--line)}
.btn:active{transform:translateY(2px)}
.orb .mic{box-shadow:0 4px 0 var(--roshan-deep),0 0 0 8px color-mix(in srgb,var(--roshan) 18%,transparent)}
/* type: tighter Latin headings, Urdu untouched */
.app:not(.ur) .t,.app:not(.ur) .d{letter-spacing:-.015em}
.soft{color:var(--soft)}
.l.soft,.xs.soft{font-weight:600}
/* AI chip: faint fill so it reads on any surface */
.ai{background:color-mix(in srgb,var(--cobalt) 7%,transparent)}
/* breathing room under the top bar */
.top{padding-block:12px 8px}

/* ===== Highlight what matters: AI surfaces + the one main action per screen ===== */
/* any card or worker card carrying an AI chip gets a soft cobalt frame + halo */
.card:has(.ai),.wc:has(.ai){border-color:color-mix(in srgb,var(--cobalt) 45%,var(--line))!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--cobalt) 9%,transparent),var(--sh1)!important}
/* live AI output blocks (transcript, diagnosis chips) become a framed box */
section[aria-live]:has(.ai):not(.card),div[aria-live]:has(.ai):not(.card *){padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--cobalt) 5%,var(--surface));border:1.5px solid color-mix(in srgb,var(--cobalt) 35%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--cobalt) 7%,transparent)}
/* AI text snippets: solid, readable tint instead of dashed */
.why,.sumry,.tr,.tx{border:1.5px solid color-mix(in srgb,var(--cobalt) 30%,transparent)!important;background:color-mix(in srgb,var(--cobalt) 8%,var(--surface))!important}
/* the main action in the thumb zone glows softly in its own colour */
.dock .btn-ok{box-shadow:0 3px 0 #06452A,0 10px 24px -8px rgba(11,107,61,.55)}
.dock .btn-t{box-shadow:0 3px 0 var(--teal-deep),0 10px 24px -8px color-mix(in srgb,var(--teal) 60%,transparent)}
.dock .btn-p{box-shadow:0 3px 0 var(--roshan-deep),0 10px 24px -8px color-mix(in srgb,var(--roshan) 70%,transparent)}
/* selected things read as selected at a glance */
.chip.sel,.fc.on,.tg.on,.tm.on,.mode.on{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 0%,transparent),0 4px 12px -6px rgba(11,16,32,.25)}

@media (prefers-reduced-motion:reduce){.app *,.app *::before,.app *::after{animation:none!important;transition:none!important}}

</style>
<style>
body{margin:0;background:#E9E6DF;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#0B1020}
.bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 24px;background:#0B1020;color:#fff}

l2 2M21 13l2 2\">\u003c/path>\u003cpath d=\"M30 10l8-4 4 6-7 5\">\u003c/path>\u003crect x=\"4\" y=\"35\" width=\"40\" height=\"8\" rx=\"2\">\u003c/rect>\u003c/g>\n\u003cg id=\"g-mech\">\u003cpath d=\"M34 5l7 4v8l-7 4-7-4V9z\">\u003c/path>\u003ccircle cx=\"34\" cy=\"13\" r=\"2.5\">\u003c/circle>\u003cpath d=\"M7 41l16-16\">\u003c/path>\u003cpath d=\"M19 21l8 8-4 4-8-8z\">\u003c/path>\u003c/g>\n\u003cg id=\"g-paint\">\u003crect x=\"6\" y=\"6\" width=\"28\" height=\"12\" rx=\"4\">\u003c/rect>\u003cpath d=\"M34 12h6v12H23v7\">\u003c/path>\u003crect x=\"20\" y=\"31\" width=\"6\" height=\"13\" rx=\"2\">\u003c/rect>\u003cpath d=\"M13 18v8a2.5 2.5 0 0 0 5 0v-3\">\u003c/path>\u003c/g>\n\u003cg id=\"g-mason\">\u003cpath d=\"M5 25L15 8l9 5-8 17z\">\u003c/path>\u003cpath d=\"M20 21l7-7\">\u003c/path>\u003crect x=\"22\" y=\"28\" width=\"21\" height=\"15\" rx=\"1.5\">\u003c/rect>\u003cpath d=\"M22 35.5h21M32.5 28v7.5M27 35.5V43M38 35.5V43\">\u003c/path>\u003c/g>\n\u003cg id=\"s-free\">\u003ccircle cx=\"8\" cy=\"8\" r=\"7\" fill=\"currentColor\">\u003c/circle>\u003c/g>\n\u003cg id=\"s-busy\">\u003ccircle cx=\"8\" cy=\"8\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003c/circle>\u003cpath d=\"M8 2a6 6 0 0 1 0 12z\" fill=\"currentColor\">\u003c/path>\u003c/g>\n\u003cg id=\"s-off\">\u003ccircle cx=\"8\" cy=\"8\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003c/circle>\u003c/g>\n\u003c/defs>\u003c/svg>\n\u003cdiv class=\"row sb\">\n\u003cdiv class=\"col g4\">\u003ch1 style=\"font-size: 44px; font-weight: 800; line-height: 1.1;\">Roshan Rozgar — design system\u003c/h1>\u003cp class=\"soft\" style=\"font-size: 18px;\">Two skins over one system: worker (Kaarigar, warm paper + amber) and customer (Ghar, cool slate + teal).\u003c/p>\u003c/div>\n\u003cdiv class=\"lockup col\" style=\"width: 300px;\">\u003cdiv class=\"truck\">\u003c/div>\u003cdiv style=\"padding: 6px 20px; font-family: 'Noto Nastaliq Urdu', serif; font-size: 34px; line-height: 1.9; text-align: center;\" lang=\"ur\">روشن روزگار\u003c/div>\u003cdiv class=\"truck\">\u003c/div>\u003c/div>\n\u003c/div>\n\u003csection class=\"sec\">\n\u003ch2 class=\"h2\">Colour tokens\u003c/h2>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 16px;\">\n\u003csc-for list=\"{{colors}}\" as=\"c\" hint-placeholder-count=\"18\">\u003cdiv class=\"sw\">\u003ci style=\"background: {{c.hex}};\">\u003c/i>\u003cb>{{c.n}}\u003c/b>\u003cspan>{{c.hex}}\u003c/span>\u003c/div>\u003c/sc-for>\n\u003c/div>\n\u003c/section>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;\">\n\u003csection class=\"sec\">\n\u003ch2 class=\"h2\">Trade quadruple · colour + glyph + Urdu word + audio\u003c/h2>\n\u003cdiv>\n\u003csc-for list=\"{{trades}}\" as=\"t\" hint-placeholder-count=\"7\">\n\u003cdiv class=\"trow tr-{{t.id}}\">\n\u003cspan class=\"gl s56\">\u003csvg class=\"gly\" viewBox=\"0 0 48 48\">\u003cuse href=\"#g-{{t.id}}\">\u003c/use>\u003c/svg>\u003c/span>\n\u003cb>{{t.en}}\u003c/b>\u003cspan class=\"ur-w\" lang=\"ur\">{{t.ur}}\u003c/span>\u003cspan class=\"row g8 soft\">\u003csvg class=\"ic s20\" viewBox=\"0 0 24 24\">\u003cuse href=\"#i-spk\">\u003c/use>\u003c/svg>\u003ci>{{t.say}}\u003c/i>\u003c/span>\u003cspan class=\"num soft\" style=\"font-family: ui-monospace, Menlo, monospace; font-size: 13px;\">{{t.hex}}\u003c/span>\n\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\u003c/section>\n\u003cdiv class=\"col g24\">\n\u003csection class=\"sec\">\n\u003ch2 class=\"h2\">Type\u003c/h2>\n\u003cdiv class=\"row g24\" style=\"align-items: flex-start;\">\n\u003cdiv class=\"col g8 fx\">\u003cspan class=\"xs soft\">WORKER · 40 / 30 / 20 / 18\u003c/span>\u003cspan style=\"font-size: 40px; font-weight: 800; line-height: 1.1;\">Display\u003c/span>\u003cspan style=\"font-size: 30px; font-weight: 800;\">Title\u003c/span>\u003cspan style=\"font-size: 20px;\">Body 20 — floor 18px\u003c/span>\u003c/div>\n\u003cdiv class=\"col g8 fx\">\u003cspan class=\"xs soft\">CUSTOMER · 30 / 22 / 16 / 14\u003c/span>\u003cspan style=\"font-size: 30px; font-weight: 800; line-height: 1.15;\">Display\u003c/span>\u003cspan style=\"font-size: 22px; font-weight: 800;\">Title\u003c/span>\u003cspan style=\"font-size: 16px;\">Body 16 — floor 14px\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"row g24\" lang=\"ur\" dir=\"rtl\">\u003cspan style=\"font-family: 'Noto Nastaliq Urdu', serif; font-size: 32px; line-height: 2;\">نستعلیق — سرخی\u003c/span>\u003cspan style=\"font-family: 'Noto Naskh Arabic', serif; font-size: 22px; line-height: 1.75;\">نسخ — عام متن کے لیے\u003c/span>\u003c/div>\n\u003cp class=\"soft\" style=\"font-size: 14px;\">Plus Jakarta Sans for Latin UI. Nastaliq for display only (its sloped baseline hurts small-size reading); Naskh carries Urdu body. Urdu +2px and +0.25 line-height at every step. Tabular numerals everywhere.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec\">\n\u003ch2 class=\"h2\">Components\u003c/h2>\n\u003cdiv class=\"row g16 wrap\">\n\u003cdiv class=\"orb\">\u003cbutton class=\"mic\" aria-label=\"Voice button\">\u003csvg class=\"ic lg\" viewBox=\"0 0 24 24\">\u003cuse href=\"#i-mic\">\u003c/use>\u003c/svg>\u003c/button>\u003c/div>\n\u003cdiv class=\"col g8 fx\">\n\u003cdiv class=\"row g8\">\u003cbutton class=\"btn btn-ok\" style=\"min-height: 56px; flex: 1;\">\u003csvg class=\"ic\" viewBox=\"0 0 24 24\">\u003cuse href=\"#i-chk\">\u003c/use>\u003c/svg>Yes, I’ll do it\u003c/button>\u003cbutton class=\"btn btn-no\" style=\"min-height: 56px; flex: 1; border-radius: 999px;\">\u003csvg class=\"ic\" viewBox=\"0 0 24 24\">\u003cuse href=\"#i-x\">\u003c/use>\u003c/svg>Not now\u003c/button>\u003c/div>\n\u003cdiv class=\"row g8 wrap\">\n\u003cspan class=\"pill\">\u003cspan class=\"dot\">\u003csvg viewBox=\"0 0 16 16\">\u003cuse href=\"#s-free\">\u003c/use>\u003c/svg>\u003c/span>Available\u003c/span>\n\u003cspan class=\"pill busy\">\u003cspan class=\"dot\">\u003csvg viewBox=\"0 0 16 16\">\u003cuse href=\"#s-busy\">\u003c/use>\u003c/svg>\u003c/span>On a job\u003c/span>\n\u003cspan class=\"pill off\">\u003cspan class=\"dot\">\u003csvg viewBox=\"0 0 16 16\">\u003cuse href=\"#s-off\">\u003c/use>\u003c/svg>\u003c/span>Off today\u003c/span>\n\u003cspan class=\"ai\">AI · demo\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"ribbon\">\u003ci>\u003c/i>\u003c/div>\n\u003c/section>\n\u003c/div>\n\u003c/div>\n\u003csection class=\"sec\" style=\"flex: 1;\">\n\u003ch2 class=\"h2\">Laws applied on every screen\u003c/h2>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; font-size: 15px; line-height: 1.5;\">\n\u003cp>\u003cb>Squint test.\u003c/b> No text-only control: every action has a glyph, colour and shape.\u003c/p>\n\u003cp>\u003cb>Thumb law.\u003c/b> Primary actions in the bottom 35%. 56px worker / 44px customer targets.\u003c/p>\n\u003cp>\u003cb>Three decisions max\u003c/b> per worker screen. No hamburger menu anywhere.\u003c/p>\n\u003cp>\u003cb>Status ×3.\u003c/b> Filled / half / hollow circle + word + motion. Never colour alone.\u003c/p>\n\u003cp>\u003cb>RTL first.\u003c/b> Logical CSS only; direction icons flip, numerals and the Latin wordmark don’t.\u003c/p>\n\u003cp>\u003cb>Contrast.\u003c/b> Amber is a surface; amber text uses #8A4A00. Glyphs on amber are ink, not white.\u003c/p>\n\u003cp>\u003cb>Trust rendered.\u003c/b> Ratings always show job count, recency and review source count.\u003c/p>\n\u003cp>\u003cb>Honest AI.\u003c/b> Every AI surface carries the cobalt AI chip; mocked data is labelled “demo”.\u003c/p>\n\u003c/div>\n\u003c/section>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"dark\":{\"editor\":\"boolean\",\"default\":false},\"$preview\":{\"width\":1280,\"height\":1560}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const colors = [\n      ['ink', '#0B1020'], ['ink-soft', '#3A4256'], ['paper', '#F8F6F1'], ['slate', '#F3F5F8'], ['roshan', '#FF9F1C'], ['roshan-deep', '#D97E06'], ['roshan-text', '#8A4A00'], ['teal', '#0E6E6B'], ['teal-deep', '#0A5250'],\n      ['free', '#1D9A5F'], ['busy', '#C2410C'], ['off', '#6B7280'], ['accept', '#0B6B3D'], ['decline', '#B3162B'], ['star', '#F2B01E'], ['rose', '#E8336D'], ['cobalt', '#2A4BD7'], ['leaf', '#3FA34D']\n    ].map((x) => ({ n: x[0], hex: x[1] }));\n    const trades = [\n      ['elec', 'Electrician', 'بجلی والا', 'bijli waala', '#F2B01E'], ['plum', 'Plumber', 'پلمبر', 'plumber', '#2A6FD7'], ['ac', 'AC technician', 'اے سی والا', 'AC waala', '#2BB3C0'],\n      ['carp', 'Carpenter', 'بڑھئی', 'barhai', '#A4622D'], ['mech', 'Mechanic', 'مستری', 'mistri', '#55606E'], ['paint', 'Painter', 'پینٹر', 'painter', '#7A4FD1'], ['mason', 'Mason', 'راج مستری', 'raj mistri', '#8A8178']\n    ].map((x) => ({ id: x[0], en: x[1], ur: x[2], say: x[3], hex: x[4] }));\n    return { colors, trades, theme: this.props.dark ? 'dark' : 'light' };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"file":"W2-Voice.dc.html","src":"\u003c!doctype html>\n\u003chtml lang=\"ur\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Voice onboarding step 1\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003clink rel=\"stylesheet\" href=\"./shared.css\">\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>body{margin:0}\u003c/style>\n\u003c/helmet>\n\u003cdiv class=\"app work {{cls}}\" dir=\"{{dir}}\" lang=\"{{lc}}\" data-theme=\"{{theme}}\">\n\u003csvg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\u003cdefs>\n\u003cg id=\"i-spk\">\u003cpath d=\"M4 9v6h4l5 4V5L8 9H4z\">\u003c/path>\u003cpath d=\"M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12\">\u003c/path>\u003c/g>\n\u003cg id=\"i-mi   var DARK = params.get('dark') === '1';
  var screens = JSON.parse(document.getElementById('screens').textContent);

  var bar = document.getElementById('bar');
  bar.innerHTML = '<b>Roshan Rozgar · Figma export</b>';
  [['en', 'English'], ['ur', 'اردو'], ['rm', 'Roman Urdu']].forEach(function (x) {
    [false, true].forEach(function (d) {
      var a = document.createElement('a');
      a.href = '?lang=' + x[0] + (d ? '&dark=1' : '');
      a.textContent = x[1] + (d ? ' · dark' : '');
      if (x[0] === LANG && d === DARK) a.className = 'on';
      bar.appendChild(a);
    });
  });
  var hint = document.createElement('span');
  hint.textContent = 'Capture this page with the html.to.design extension → editable Figma layers';
  bar.appendChild(hint);

  function DCLogic(props) { this.props = props; this.state = null; }
  DCLogic.prototype.setState = function () {};
  DCLogic.prototype.forceUpdate = function () {};

  function lookup(ctx, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^'.*'$/.test(path)) return path.slice(1, -1);
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, ctx);
  }
  function interp(str, ctx) {
    var whole = str.match(/^\s*\{\{([^}]+)\}\}\s*$/);
    if (whole) return lookup(ctx, whole[1]);
    return str.replace(/\{\{([^}]+)\}\}/g, function (_, p) { var v = lookup(ctx, p); return v == null ? '' : String(v); });
  }

  function renderNodes(nodes, ctx, out, scope) {
    for (var i = 0; i < nodes.length; i++) renderNode(nodes[i], ctx, out, scope);
  }
  function renderNode(node, ctx, out, scope) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(String(interp(node.nodeValue, ctx) ?? ''))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'helmet' || tag === 'script') return;
    if (tag === 'sc-for') {
      var list = lookup(ctx, (node.getAttribute('list') || '').replace(/^\s*\{\{|\}\}\s*$/g, '')) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, idx) {
        var c = Object.assign({}, ctx); c[as] = item; c.$index = idx;
        renderNodes(node.childNodes, c, out, scope);
      });
      return;
    }
    if (tag === 'sc-if') {
      var v = interp(node.getAttribute('value') || '', ctx);
      if (v) renderNodes(node.childNodes, ctx, out, scope);
      return;
    }
    var el = node.namespaceURI === SVG ? document.createElementNS(SVG, tag) : document.createElement(tag);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name;
      if (/^on/i.test(name) || /^hint-/.test(name)) continue;
      var val = interp(at.value, ctx);
      if (typeof val === 'function' || val == null) continue;
      val = String(val);
      // keep SVG sprite ids unique per screen (different screens reuse the same id for different shapes)
      if (name === 'id') val = scope + '-' + val;
      if ((name === 'href' || name === 'xlink:href') && val.charAt(0) === '#') val = '#' + scope + '-' + val.slice(1);
      if (name === 'aria-labelledby') val = scope + '-' + val;
      val = val.replace(/url\(#([^)]+)\)/g, function (_, id) { return 'url(#' + scope + '-' + id + ')'; });
      el.setAttribute(name, val);
    }
    renderNodes(node.childNodes, ctx, el, scope);
    out.appendChild(el);
  }

  function scopeCss(text, scope) {
    var sheet = new CSSStyleSheet();
    try { sheet.replaceSync(text); } catch (e) { return ''; }
    var css = '';
    Array.prototype.forEach.call(sheet.cssRules, function (r) {
      if (r.selectorText) {
        var sel = r.selectorText.split(',').map(function (s) { s = s.trim(); return s === 'body' ? null : '.' + scope + ' ' + s; }).filter(Boolean);
        if (sel.length) css += sel.join(',') + '{' + r.style.cssText + '}\n';
      } else {
        css += r.cssText + '\n';
      }
    });
    return css;
  }

  var groups = [
    { title: 'Worker skin · Kaarigar', files: ['Splash.dc.html', 'Main.dc.html', 'W2-Voice.dc.html', 'W3-Trade.dc.html', 'W4-Skills.dc.html', 'W5-Proof.dc.html', 'W6-Home.dc.html', 'W7-Request.dc.html', 'W8-Chat.dc.html', 'W9-Done.dc.html'] },
    { title: 'Customer skin · Ghar', files: ['C1-Describe.dc.html', 'C2-Results.dc.html', 'C3-Profile.dc.html', 'C4-Booking.dc.html', 'C5-Live.dc.html', 'C6-Review.dc.html', 'C7-States.dc.html'] },
    { title: 'Design system', files: ['System.dc.html'] }
  ];
  var byFile = {}; screens.forEach(function (s) { byFile[s.file] = s; });
  var sheetEl = document.getElementById('sheet');
  var n = 0;

  groups.forEach(function (g) {
    var h = document.createElement('h2'); h.className = 'row-title'; h.textContent = g.title + ' — ' + ({ en: 'English', ur: 'Urdu', rm: 'Roman Urdu' })[LANG] + (DARK ? ' · dark' : '');
    var row = document.createElement('section'); row.className = 'row';
    sheetEl.appendChild(h); sheetEl.appendChild(row);
    g.files.forEach(function (f) {
      var s = byFile[f]; if (!s) return;
      var scope = 's' + (n++);
      var doc = new DOMParser().parseFromString(s.src, 'text/html');
      var script = doc.querySelector('script[data-dc-script]');
      var props = {};
      try {
        var decl = JSON.parse(script.getAttribute('data-props') || '{}');
        Object.keys(decl).forEach(function (k) { if (k.charAt(0) !== '$' && 'default' in decl[k]) props[k] = decl[k].default; });
      } catch (e) {}
      props.lang = LANG; props.dark = DARK;
      var Component = new Function('DCLogic', script.textContent + '\n;return Component;')(DCLogic);
      var inst = new Component(props); inst.props = props; inst.state = inst.state || null;
      var ctx = inst.renderVals();

      var styleText = Array.prototype.map.call(doc.querySelectorAll('helmet style'), function (st) { return st.textContent; }).join('\n');
      var style = document.createElement('style'); style.textContent = scopeCss(styleText, scope);
      document.head.appendChild(style);

      var frame = document.createElement('div'); frame.className = 'frame' + (f === 'System.dc.html' ? ' wide' : '');
      var label = document.createElement('h3'); label.textContent = (doc.querySelector('title') || {}).textContent || f;
      var box = document.createElement('div'); box.className = 'box ' + scope;
      var xdc = doc.querySelector('x-dc');
      renderNodes(xdc.childNodes, ctx, box, scope);
      frame.appendChild(label); frame.appendChild(box); row.appendChild(frame);
    });
  });
})();
</script>
</body>
