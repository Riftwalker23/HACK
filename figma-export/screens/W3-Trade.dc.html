<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<title>Confirm trade</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shared.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app work {{cls}}" dir="{{dir}}" lang="{{lc}}" data-theme="{{theme}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-spk"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></g>
<g id="i-chk"><path d="M4 12.5l5 5L20 6.5"></path></g>
<g id="i-mic"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"></path></g>
<g id="i-tools"><path d="M14.5 6.5a4 4 0 0 1 5.2-3.7l-2.6 2.6.5 2.5 2.5.5 2.6-2.6a4 4 0 0 1-5.4 4.9L8 20a2 2 0 0 1-3-3l9.3-9.3a4 4 0 0 1 .2-1.2z"></path></g>
<g id="i-clock"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></g>
<g id="i-pin"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></g>
<g id="i-cam"><path d="M3 8h4l2-3h6l2 3h4v11H3z"></path><circle cx="12" cy="13" r="3.5"></circle></g>
<g id="g-elec"><rect x="6" y="6" width="36" height="36" rx="12"></rect><path d="M27 11L16 26h7.5l-3 11L32 21h-7.5z"></path></g>
<g id="g-plum"><path d="M13 4s-7 8-7 13a7 7 0 0 0 14 0c0-5-7-13-7-13z"></path><path d="M20 43l13-13"></path><path d="M30 33l-6-6 9-9a6 6 0 0 1 8.5 0l-3 3 1 4 4 1 0 0a6 6 0 0 1-1 4l-6 6"></path></g>
<g id="g-ac"><rect x="5" y="6" width="38" height="14" rx="4"></rect><path d="M11 15h26"></path><path d="M24 25v18M16.5 29.5l15 9M31.5 29.5l-15 9M21 26.5l3 3 3-3M21 41.5l3-3 3 3"></path></g>
<g id="g-carp"><path d="M5 27L27 7l6 6-21 19z"></path><path d="M9 25l2 2M13 21l2 2M17 17l2 2M21 13l2 2"></path><path d="M30 10l8-4 4 6-7 5"></path><rect x="4" y="35" width="40" height="8" rx="2"></rect></g>
<g id="g-mech"><path d="M34 5l7 4v8l-7 4-7-4V9z"></path><circle cx="34" cy="13" r="2.5"></circle><path d="M7 41l16-16"></path><path d="M19 21l8 8-4 4-8-8z"></path></g>
<g id="g-paint"><rect x="6" y="6" width="28" height="12" rx="4"></rect><path d="M34 12h6v12H23v7"></path><rect x="20" y="31" width="6" height="13" rx="2"></rect><path d="M13 18v8a2.5 2.5 0 0 0 5 0v-3"></path></g>
<g id="g-mason"><path d="M5 25L15 8l9 5-8 17z"></path><path d="M20 21l7-7"></path><rect x="22" y="28" width="21" height="15" rx="1.5"></rect><path d="M22 35.5h21M32.5 28v7.5M27 35.5V43M38 35.5V43"></path></g>
</defs></svg>
<header class="top">
<button class="iconbtn" aria-label="{{t.read}}"><svg class="ic" viewBox="0 0 24 24"><use href="#i-spk"></use></svg></button>
<div class="seg3" role="group" aria-label="Language">
<button class="{{ur_on}}" aria-pressed="{{ur_p}}" onClick="{{setUr}}">اردو</button>
<button class="{{rm_on}}" aria-pressed="{{rm_p}}" onClick="{{setRm}}">Roman</button>
<button class="{{en_on}}" aria-pressed="{{en_p}}" onClick="{{setEn}}">EN</button>
</div>
</header>
<main class="col g12 fx px">
<div class="rail sm" role="img" aria-label="{{t.step}}">
<span class="n done"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-chk"></use></svg></span><span class="ln done"></span>
<span class="n cur"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-tools"></use></svg></span><span class="ln"></span>
<span class="n"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-pin"></use></svg></span><span class="ln"></span>
<span class="n"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-cam"></use></svg></span>
</div>
<div class="row sb g8">
<h1 class="t nq">{{t.q}}</h1>
<span class="ai">AI · {{t.guess}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; flex: 1;">
<sc-for list="{{trades}}" as="item" hint-placeholder-count="7">
<div class="tile tr-{{item.id}} {{item.selc}}">
<button class="tm" aria-pressed="{{item.on}}" onClick="{{item.pick}}">
<span class="gl s56"><svg class="gly" viewBox="0 0 48 48"><use href="#g-{{item.id}}"></use></svg></span>
<span class="l bold">{{item.name}}</span>
</button>
<sc-if value="{{item.on}}" hint-placeholder-val="{{false}}"><span class="tick" aria-hidden="true"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-chk"></use></svg></span></sc-if>
<button class="spk" aria-label="{{item.hear}}"><svg class="ic s24" viewBox="0 0 24 24"><use href="#i-spk"></use></svg></button>
</div>
</sc-for>
<button class="tile" aria-label="{{t.sayIt}}" style="border-radius: var(--r-lg); border: 3px dashed var(--line); background: transparent; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--soft);"><svg class="ic lg" viewBox="0 0 24 24"><use href="#i-mic"></use></svg><span class="l">{{t.other}}</span></button>
</div>
</main>
<div class="dock">
<a class="btn btn-ok big" href="W4-Skills.dc.html"><svg class="ic lg" viewBox="0 0 24 24"><use href="#i-chk"></use></svg>{{t.yes}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ur","rm","en"],"default":"ur"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = (this.state && this.state.lang) || this.props.lang || 'ur';
    const sel = (this.state && this.state.sel) || 'elec';
    const set = (l) => () => this.setState({ lang: l });
    const N = {
      ur: { elec: 'بجلی والا', plum: 'پلمبر', ac: 'اے سی والا', carp: 'بڑھئی', mech: 'مستری', paint: 'پینٹر', mason: 'راج مستری' },
      rm: { elec: 'Bijli waala', plum: 'Plumber', ac: 'AC waala', carp: 'Barhai', mech: 'Mistri', paint: 'Painter', mason: 'Raj mistri' },
      en: { elec: 'Electrician', plum: 'Plumber', ac: 'AC technician', carp: 'Carpenter', mech: 'Mechanic', paint: 'Painter', mason: 'Mason' }
    };
    const D = {
      ur: { q: 'کیا آپ بجلی والے ہیں؟', guess: 'ہم نے یہ سنا', yes: 'ہاں، یہی ہے', other: 'کچھ اور؟ بولیں', sayIt: 'کوئی اور کام بول کر بتائیں', step: 'مرحلہ 2 از 4', read: 'یہ صفحہ سنیں', hear: 'سنیں' },
      rm: { q: 'Kya aap bijli waale hain?', guess: 'humne yeh suna', yes: 'Haan, yahi hai', other: 'Kuch aur? Bolein', sayIt: 'Koi aur kaam bol kar batayein', step: 'Marhala 2 az 4', read: 'Yeh safha sunein', hear: 'Sunein' },
      en: { q: 'Are you an electrician?', guess: 'we heard this', yes: 'Yes, that’s me', other: 'Something else? Say it', sayIt: 'Say another trade', step: 'Step 2 of 4', read: 'Read this page aloud', hear: 'Hear' }
    };
    const t = D[L];
    const trades = ['elec', 'plum', 'ac', 'carp', 'mech', 'paint', 'mason'].map((id) => ({
      id, name: N[L][id], on: id === sel, selc: id === sel ? 'sel' : '', hear: t.hear + ': ' + N[L][id],
      pick: () => this.setState({ sel: id })
    }));
    return { t, trades, dir: L === 'ur' ? 'rtl' : 'ltr', cls: L, lc: L === 'rm' ? 'ur-Latn' : L, theme: this.props.dark ? 'dark' : 'light',
      ur_on: L === 'ur' ? 'on' : '', rm_on: L === 'rm' ? 'on' : '', en_on: L === 'en' ? 'on' : '',
      ur_p: L === 'ur', rm_p: L === 'rm', en_p: L === 'en', setUr: set('ur'), setRm: set('rm'), setEn: set('en') };
  }
}
</script>
</body>
</html>
