<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Describe the problem</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shared.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}
.mode{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.mode.on{border-color:var(--teal);background:var(--ttint);color:var(--text)}
.bb{position:absolute;border:2px solid #fff;border-radius:8px;box-shadow:0 0 0 2px rgba(11,16,32,.5)}
.bb span{position:absolute;inset-block-start:-13px;inset-inline-start:6px;background:#fff;color:#0B1020;font:700 12px/1 "Plus Jakarta Sans","Noto Naskh Arabic",sans-serif;padding:5px 7px;border-radius:6px;white-space:nowrap}
.cls{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px 0 12px;padding-inline:12px 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:14px}
.cls b{font-weight:800}
.cls button{width:32px;height:32px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;padding:0;color:var(--soft)}
</style>
</helmet>
<div class="app cust {{cls}}" dir="{{dir}}" lang="{{lc}}" data-theme="{{theme}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-pin"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></g>
<g id="i-kb"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></g>
<g id="i-mic"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"></path></g>
<g id="i-cam"><path d="M3 8h4l2-3h6l2 3h4v11H3z"></path><circle cx="12" cy="13" r="3.5"></circle></g>
<g id="i-pen"><path d="M4 20h4L19 9l-4-4L4 16z"></path></g>
<g id="i-search"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></g>
</defs></svg>
<header class="top">
<span class="row g4 l bold fx" style="min-width: 0;"><svg class="ic s20 tl" viewBox="0 0 24 24"><use href="#i-pin"></use></svg>G-11, Islamabad</span>
<div class="seg3" role="group" aria-label="Language" style="flex: none; width: 200px;">
<button class="{{ur_on}}" aria-pressed="{{ur_p}}" onClick="{{setUr}}">اردو</button>
<button class="{{rm_on}}" aria-pressed="{{rm_p}}" onClick="{{setRm}}">Roman</button>
<button class="{{en_on}}" aria-pressed="{{en_p}}" onClick="{{setEn}}">EN</button>
</div>
</header>
<main class="col g12 fx px">
<h1 class="t">{{t.h}}</h1>
<div class="row g8" role="group" aria-label="{{t.how}}">
<button class="mode"><svg class="ic" viewBox="0 0 24 24"><use href="#i-kb"></use></svg>{{t.type}}</button>
<button class="mode"><svg class="ic" viewBox="0 0 24 24"><use href="#i-mic"></use></svg>{{t.speak}}</button>
<button class="mode on" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cam"></use></svg>{{t.photo}}</button>
</div>
<div style="position: relative; height: 250px; border-radius: 18px; overflow: hidden;" role="img" aria-label="{{t.alt}}">
<svg viewBox="0 0 358 250" width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0;">
<rect width="358" height="250" fill="#C9C1B0"></rect><rect x="0" y="0" width="358" height="250" fill="url(#tiles)"></rect>
<defs><pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#D8D2C4"></rect><path d="M40 0H0v40" fill="none" stroke="#BDB5A4" stroke-width="2"></path></pattern></defs>
<rect x="120" y="22" width="110" height="170" rx="40" fill="#F4F4F2" stroke="#9AA0A8" stroke-width="3"></rect>
<rect x="150" y="70" width="50" height="22" rx="4" fill="#3A4256"></rect>
<path d="M150 192v40M200 192v40" stroke="#8D95A3" stroke-width="6"></path>
<circle cx="200" cy="210" r="9" fill="#C2410C"></circle>
<path d="M205 220q4 12 0 24M196 222q-3 10 0 22" stroke="#2A6FD7" stroke-width="3" fill="none"></path>
</svg>
<div class="bb" style="left: 112px; top: 16px; width: 126px; height: 182px;"><span>{{t.b1}} 96%</span></div>
<div class="bb" style="left: 182px; top: 196px; width: 44px; height: 48px; border-color: #FFB347;"><span style="background: #FFB347;">{{t.b2}}</span></div>
<span class="ai" style="position: absolute; inset-block-start: 10px; inset-inline-end: 10px; background: #fff; color: #2A4BD7; border-color: #2A4BD7;">AI · demo</span>
</div>
<div class="col g8" aria-live="polite">
<div class="row sb"><span class="l bold soft">{{t.understood}}</span><span class="ai">AI</span></div>
<div class="row g8 wrap">
<span class="cls tr-plum"><span class="gl s32" style="width: 24px; height: 24px;"></span>{{t.k1}} <b>{{t.v1}}</b><button aria-label="{{t.edit}}"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-pen"></use></svg></button></span>
<span class="cls" style="border-color: var(--decline);">{{t.k2}} <b>{{t.v2}}</b><button aria-label="{{t.edit}}"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-pen"></use></svg></button></span>
<span class="cls">{{t.k3}} <b>{{t.v3}}</b><button aria-label="{{t.edit}}"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-pen"></use></svg></button></span>
</div>
</div>
</main>
<div class="dock">
<a class="btn btn-t" href="C2-Results.dc.html" style="min-height: 56px;"><svg class="ic s24" viewBox="0 0 24 24"><use href="#i-search"></use></svg>{{t.find}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ur","rm","en"],"default":"en"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = (this.state && this.state.lang) || this.props.lang || 'en';
    const set = (l) => () => this.setState({ lang: l });
    const D = {
      ur: { h: 'کیا خراب ہے؟', how: 'بتانے کا طریقہ', type: 'لکھیں', speak: 'بولیں', photo: 'تصویر', alt: 'گیزر کی تصویر، نیچے والو سے پانی ٹپک رہا ہے', b1: 'گیزر', b2: 'والو لیک', understood: 'ہم یہ سمجھے', k1: 'کام:', v1: 'پلمبر', k2: 'جلدی:', v2: 'ابھی', k3: 'ممکنہ حل:', v3: 'پریشر والو بدلنا', edit: 'بدلیں', find: 'قریب پلمبر ڈھونڈیں' },
      rm: { h: 'Kya kharab hai?', how: 'Batane ka tareeqa', type: 'Likhein', speak: 'Bolein', photo: 'Tasveer', alt: 'Geyser ki tasveer, neeche waale valve se paani tapak raha hai', b1: 'Geyser', b2: 'Valve leak', understood: 'Hum yeh samjhe', k1: 'Kaam:', v1: 'Plumber', k2: 'Jaldi:', v2: 'Abhi', k3: 'Mumkina hal:', v3: 'Pressure valve badalna', edit: 'Badlein', find: 'Qareeb plumber dhoondein' },
      en: { h: 'What needs fixing?', how: 'How to describe it', type: 'Type', speak: 'Speak', photo: 'Photo', alt: 'Photo of a geyser, water dripping from the lower valve', b1: 'Geyser', b2: 'Valve leak', understood: 'What we understood', k1: 'Trade:', v1: 'Plumber', k2: 'Urgency:', v2: 'Now', k3: 'Likely fix:', v3: 'Replace pressure valve', edit: 'Edit', find: 'Find a plumber nearby' }
    };
    return { t: D[L], dir: L === 'ur' ? 'rtl' : 'ltr', cls: L, lc: L === 'rm' ? 'ur-Latn' : L, theme: this.props.dark ? 'dark' : 'light',
      ur_on: L === 'ur' ? 'on' : '', rm_on: L === 'rm' ? 'on' : '', en_on: L === 'en' ? 'on' : '',
      ur_p: L === 'ur', rm_p: L === 'rm', en_p: L === 'en', setUr: set('ur'), setRm: set('rm'), setEn: set('en') };
  }
}
</script>
</body>
</html>
