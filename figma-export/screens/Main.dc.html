<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<title>Role choice</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shared.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.role{position:relative;flex:1;border-radius:28px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh2)}
.role.rw{background:var(--roshan);color:#0B1020}
.role.rc{background:var(--teal);color:var(--on-teal)}
.role .go{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;color:inherit;text-decoration:none}
.role .go::after{content:"";position:absolute;inset:0;border-radius:28px}
.role .disc{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#0B1020;color:var(--roshan)}
.role.rc .disc{background:var(--on-teal);color:var(--teal)}
.role .arrow{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#0B1020;color:var(--roshan);flex:none}
.role.rc .arrow{background:var(--on-teal);color:var(--teal)}
.role .spk{position:relative;z-index:2;width:56px;height:56px;border-radius:50%;border:2px solid currentColor;background:transparent;display:grid;place-items:center;padding:0}
.wm{font-family:"Noto Nastaliq Urdu",serif;font-size:32px;line-height:1.8;font-weight:700}
.wl{font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;letter-spacing:.24em;font-weight:800}
</style>
</helmet>
<div class="app work {{cls}}" dir="{{dir}}" lang="{{lc}}" data-theme="{{theme}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-spk"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></g>
<g id="i-tools"><path d="M14.5 6.5a4 4 0 0 1 5.2-3.7l-2.6 2.6.5 2.5 2.5.5 2.6-2.6a4 4 0 0 1-5.4 4.9L8 20a2 2 0 0 1-3-3l9.3-9.3a4 4 0 0 1 .2-1.2z"></path></g>
<g id="i-house"><path d="M3 11l9-7 9 7M5 9.5V20h14V9.5M10 20v-6h4v6"></path></g>
<g id="g-elec"><rect x="6" y="6" width="36" height="36" rx="12"></rect><path d="M27 11L16 26h7.5l-3 11L32 21h-7.5z"></path></g>
<g id="g-plum"><path d="M13 4s-7 8-7 13a7 7 0 0 0 14 0c0-5-7-13-7-13z"></path><path d="M20 43l13-13"></path><path d="M30 33l-6-6 9-9a6 6 0 0 1 8.5 0l-3 3 1 4 4 1a6 6 0 0 1-1 4l-6 6"></path></g>
<g id="g-ac"><rect x="5" y="6" width="38" height="14" rx="4"></rect><path d="M11 15h26"></path><path d="M24 25v18M16.5 29.5l15 9M31.5 29.5l-15 9M21 26.5l3 3 3-3M21 41.5l3-3 3 3"></path></g>
<g id="i-chev"><path d="M9 5l7 7-7 7"></path></g>
<g id="i-lamp"><path d="M3 13h18a9 6.5 0 0 1-18 0z"></path><path d="M12 2.5c2.4 2.4 3.4 4 3.4 5.8a3.4 3.4 0 0 1-6.8 0c0-1.8 1-3.4 3.4-5.8z"></path></g>
</defs></svg>
<header class="top">
<button class="iconbtn" aria-label="{{t.read}}"><svg class="ic" viewBox="0 0 24 24"><use href="#i-spk"></use></svg></button>
<div class="seg3" role="group" aria-label="Language">
<button class="{{ur_on}}" aria-pressed="{{ur_p}}" onClick="{{setUr}}">اردو</button>
<button class="{{rm_on}}" aria-pressed="{{rm_p}}" onClick="{{setRm}}">Roman</button>
<button class="{{en_on}}" aria-pressed="{{en_p}}" onClick="{{setEn}}">EN</button>
</div>
</header>
<main class="col g16 fx px" style="padding-bottom: 20px;">
<div class="lockup col">
<div class="truck"></div>
<div class="row g12" style="padding: 10px 16px;">
<div class="gl s56" style="--c: var(--roshan); --g: #0B1020;"><svg class="ic" viewBox="0 0 24 24" style="width: 32px; height: 32px;"><use href="#i-lamp"></use></svg></div>
<div class="col" dir="ltr" style="align-items: flex-start;">
<div class="wm" lang="ur">روشن روزگار</div>
<div class="wl soft">ROSHAN ROZGAR</div>
</div>
</div>
<div class="truck"></div>
</div>
<div class="jhalar" aria-hidden="true" style="margin-top: -18px; margin-inline: 14px;"></div>
<h1 class="b bold nq" style="text-align: center; margin-top: -6px;">{{t.hello}}</h1>
<div class="role rw">
<div class="row sb">
<div class="row" style="gap: 0;">
<span class="gl s72 tr-elec" style="border: 4px solid #0B1020;"><svg class="gly" viewBox="0 0 48 48"><use href="#g-elec"></use></svg></span>
<span class="gl s72 tr-plum" style="border: 4px solid #0B1020; margin-inline-start: -14px;"><svg class="gly" viewBox="0 0 48 48"><use href="#g-plum"></use></svg></span>
<span class="gl s72 tr-ac" style="border: 4px solid #0B1020; margin-inline-start: -14px;"><svg class="gly" viewBox="0 0 48 48"><use href="#g-ac"></use></svg></span>
</div>
<button class="spk" aria-label="{{t.hearW}}"><svg class="ic" viewBox="0 0 24 24"><use href="#i-spk"></use></svg></button>
</div>
<a class="go" href="W2-Voice.dc.html"><span class="t nq">{{t.worker}}</span><span class="arrow"><svg class="ic flip" viewBox="0 0 24 24"><use href="#i-chev"></use></svg></span></a>
</div>
<div class="role rc">
<div class="row sb">
<div class="disc"><svg class="ic xl" viewBox="0 0 24 24"><use href="#i-house"></use></svg></div>
<button class="spk" aria-label="{{t.hearC}}"><svg class="ic" viewBox="0 0 24 24"><use href="#i-spk"></use></svg></button>
</div>
<a class="go" href="C1-Describe.dc.html"><span class="t nq">{{t.cust}}</span><span class="arrow"><svg class="ic flip" viewBox="0 0 24 24"><use href="#i-chev"></use></svg></span></a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ur","rm","en"],"default":"ur"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = (this.state && this.state.lang) || this.props.lang || 'ur';
    const set = (l) => () => this.setState({ lang: l });
    const D = {
      ur: { hello: 'السلام علیکم! آپ کون ہیں؟', worker: 'میں کام کرتا ہوں', cust: 'مجھے کام کرانا ہے', tag: 'ہنر کو روزگار سے ملائیں', read: 'یہ صفحہ سنیں', hearW: 'سنیں: میں کام کرتا ہوں', hearC: 'سنیں: مجھے کام کرانا ہے' },
      rm: { hello: 'Assalam-o-Alaikum! Aap kaun hain?', worker: 'Main kaam karta hoon', cust: 'Mujhe kaam karana hai', tag: 'Hunar ko rozgar se milayein', read: 'Yeh safha sunein', hearW: 'Sunein: Main kaam karta hoon', hearC: 'Sunein: Mujhe kaam karana hai' },
      en: { hello: 'Assalam-o-Alaikum! Who are you?', worker: 'I do work', cust: 'I need work done', tag: 'Connecting skill with work', read: 'Read this page aloud', hearW: 'Hear: I do work', hearC: 'Hear: I need work done' }
    };
    return { t: D[L], dir: L === 'ur' ? 'rtl' : 'ltr', cls: L, lc: L === 'rm' ? 'ur-Latn' : L, theme: this.props.dark ? 'dark' : 'light',
      ur_on: L === 'ur' ? 'on' : '', rm_on: L === 'rm' ? 'on' : '', en_on: L === 'en' ? 'on' : '',
      ur_p: L === 'ur', rm_p: L === 'rm', en_p: L === 'en', setUr: set('ur'), setRm: set('rm'), setEn: set('en') };
  }
}
</script>
</body>
</html>
