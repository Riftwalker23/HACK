<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<title>Skills and experience</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./shared.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}
.sk{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 8px 8px 12px;padding-inline:12px 8px;border-radius:20px;background:var(--surface);border:2px solid var(--line)}
.sk .x{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;color:var(--decline);flex:none}
mark{background:color-mix(in srgb,var(--roshan) 35%,transparent);color:inherit;border-radius:4px;padding:0 3px}
</style>
</helmet>
<div class="app work {{cls}}" dir="{{dir}}" lang="{{lc}}" data-theme="{{theme}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-spk"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path></g>
<g id="i-chk"><path d="M4 12.5l5 5L20 6.5"></path></g>
<g id="i-x"><path d="M6 6l12 12M18 6L6 18"></path></g>
<g id="i-mic"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"></path></g>
<g id="i-pin"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></g>
<g id="i-cam"><path d="M3 8h4l2-3h6l2 3h4v11H3z"></path><circle cx="12" cy="13" r="3.5"></circle></g>
<g id="i-wire"><path d="M3 7h5a4 4 0 0 1 4 4v2a4 4 0 0 0 4 4h5"></path><circle cx="3" cy="7" r="1"></circle><circle cx="21" cy="17" r="1"></circle></g>
<g id="i-fan"><circle cx="12" cy="12" r="2"></circle><path d="M12 10c0-4 1-7 4-7 2 0 2 3-4 7zM14 12c4 0 7 1 7 4 0 2-3 2-7-4zM12 14c0 4-1 7-4 7-2 0-2-3 4-7zM10 12c-4 0-7-1-7-4 0-2 3-2 7 4z"></path></g>
<g id="i-panel"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h2v4H8zM14 7h2v4h-2zM8 14h8M8 17h8"></path></g>
<g id="i-geyser"><rect x="7" y="2" width="10" height="16" rx="5"></rect><path d="M10 18v4M14 18v4M10 8h4"></path></g>
<g id="i-bulb"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></g>
<g id="i-batt"><rect x="3" y="7" width="16" height="10" rx="2"></rect><path d="M21 10v4M8 12h6M11 9v6"></path></g>
<g id="i-tools"><path d="M14.5 6.5a4 4 0 0 1 5.2-3.7l-2.6 2.6.5 2.5 2.5.5 2.6-2.6a4 4 0 0 1-5.4 4.9L8 20a2 2 0 0 1-3-3l9.3-9.3a4 4 0 0 1 .2-1.2z"></path></g>
</defs></svg>
<header class="top">
<button class="iconbtn" aria-label="{{t.read}}"><svg class="ic" viewBox="0 0 24 24"><use href="#i-spk"></use></svg></button>
<div class="seg3" role="group" aria-label="Language">
<button class="{{ur_on}}" aria-pressed="{{ur_p}}" onClick="{{setUr}}">اردو</button>
<button class="{{rm_on}}" aria-pressed="{{rm_p}}" onClick="{{setRm}}">Roman</button>
<button class="{{en_on}}" aria-pressed="{{en_p}}" onClick="{{setEn}}">EN</button>
</div>
</header>
<main class="col g12 fx px">
<div class="rail sm" role="img" aria-label="{{t.step}}">
<span class="n done"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-chk"></use></svg></span><span class="ln done"></span>
<span class="n done"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-chk"></use></svg></span><span class="ln done"></span>
<span class="n cur"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-tools"></use></svg></span><span class="ln"></span>
<span class="n"><svg class="ic s20" viewBox="0 0 24 24"><use href="#i-cam"></use></svg></span>
</div>
<div class="row g12">
<div class="col ctr" style="width: 96px; height: 96px; border-radius: 24px; background: var(--roshan); color: #0B1020; flex: none;"><span class="d num" style="font-family: 'Plus Jakarta Sans', sans-serif;">15</span><span class="l bold">{{t.years}}</span></div>
<div class="col g4 fx">
<h1 class="t nq">{{t.title}}</h1>
<div class="row g8"><span class="ai">AI · demo</span><span class="l soft">{{t.from}}</span></div>
</div>
</div>
<p class="l card" style="padding: 12px 14px; border-radius: 16px;">{{t.q1}}<mark>{{t.m1}}</mark>{{t.q2}}<mark>{{t.m2}}</mark>{{t.q3}}</p>
<ul class="col g8" aria-label="{{t.title}}">
<sc-for list="{{skills}}" as="s" hint-placeholder-count="6">
<li class="sk">
<span class="gl s40 tr-elec"><svg class="ic s24" viewBox="0 0 24 24"><use href="#i-{{s.ic}}"></use></svg></span>
<span class="b bold fx">{{s.name}}</span>
<button class="x" aria-label="{{s.rm}}" onClick="{{s.remove}}"><svg class="ic s24" viewBox="0 0 24 24"><use href="#i-x"></use></svg></button>
</li>
</sc-for>
</ul>
</main>
<div class="dock">
<div class="row g12">
<button class="btn btn-o fx" style="min-height: 72px;"><svg class="ic" viewBox="0 0 24 24" style="color: var(--roshan-text);"><use href="#i-mic"></use></svg>{{t.more}}</button>
<a class="btn btn-ok fx" href="W5-Proof.dc.html" style="min-height: 72px;"><svg class="ic" viewBox="0 0 24 24"><use href="#i-chk"></use></svg>{{t.ok}}</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ur","rm","en"],"default":"ur"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = (this.state && this.state.lang) || this.props.lang || 'ur';
    const gone = (this.state && this.state.gone) || [];
    const set = (l) => () => this.setState({ lang: l });
    const D = {
      ur: { years: 'سال', title: 'آپ کے ہنر', from: 'آپ کی باتوں سے', q1: '“گھر کی ', m1: 'وائرنگ', q2: '، پنکھے، اور ', m2: 'بریکر بورڈ', q3: ' کا کام کرتا ہوں…”', more: 'اور بتائیں', ok: 'ٹھیک ہے', rm: 'ہٹائیں', step: 'مرحلہ 3 از 4', read: 'یہ صفحہ سنیں',
        s: ['گھر کی وائرنگ', 'پنکھا لگانا', 'بریکر بورڈ', 'گیزر (بجلی)', 'لائٹ فٹنگ', 'یو پی ایس'] },
      rm: { years: 'saal', title: 'Aap ke hunar', from: 'aap ki baaton se', q1: '“Ghar ki ', m1: 'wiring', q2: ', pankhay, aur ', m2: 'breaker board', q3: ' ka kaam karta hoon…”', more: 'Aur batayein', ok: 'Theek hai', rm: 'Hatayein', step: 'Marhala 3 az 4', read: 'Yeh safha sunein',
        s: ['Ghar ki wiring', 'Pankha lagana', 'Breaker board', 'Geyser (bijli)', 'Light fitting', 'UPS'] },
      en: { years: 'years', title: 'Your skills', from: 'from your own words', q1: '“I do house ', m1: 'wiring', q2: ', fans, and ', m2: 'breaker boards', q3: '…”', more: 'Tell more', ok: 'Looks right', rm: 'Remove', step: 'Step 3 of 4', read: 'Read this page aloud',
        s: ['House wiring', 'Fan fitting', 'Breaker board', 'Electric geyser', 'Light fitting', 'UPS install'] }
    };
    const t = D[L];
    const ics = ['wire', 'fan', 'panel', 'geyser', 'bulb', 'batt'];
    const skills = ics.map((ic, i) => ({ ic, name: t.s[i], rm: t.rm + ': ' + t.s[i], remove: () => this.setState({ gone: gone.concat([ic]) }) }))
      .filter((s) => gone.indexOf(s.ic) < 0);
    return { t, skills, dir: L === 'ur' ? 'rtl' : 'ltr', cls: L, lc: L === 'rm' ? 'ur-Latn' : L, theme: this.props.dark ? 'dark' : 'light',
      ur_on: L === 'ur' ? 'on' : '', rm_on: L === 'rm' ? 'on' : '', en_on: L === 'en' ? 'on' : '',
      ur_p: L === 'ur', rm_p: L === 'rm', en_p: L === 'en', setUr: set('ur'), setRm: set('rm'), setEn: set('en') };
  }
}
</script>
</body>
</html>
